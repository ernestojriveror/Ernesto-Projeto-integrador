<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mente Acolhedora - Entrar</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root { --cor-fundo: #f0fdf4; --cor-primaria: #059669; --cor-primaria-escura: #047857; --cor-texto: #1e293b; --cor-branco: #ffffff; --cor-suave: #d1fae5; --cor-muted: #64748b; --tamanho-base: 16px; }
        body.alto-contraste { --cor-fundo: #121212; --cor-primaria: #bb86fc; --cor-primaria-escura: #9965e8; --cor-texto: #ffffff; --cor-branco: #1e1e1e; --cor-suave: #2a1f3d; --cor-muted: #aaaaaa; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'DM Sans', Arial, sans-serif; background-color: var(--cor-fundo); color: var(--cor-texto); font-size: var(--tamanho-base); min-height: 100vh; display: flex; flex-direction: column; }
        .barra-acessibilidade { background-color: var(--cor-primaria); color: white; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; }
        .barra-acessibilidade span { font-size: 0.85rem; opacity: 0.9; }
        .controles-acess button { background: transparent; border: 1px solid rgba(255,255,255,0.6); color: white; padding: 4px 10px; border-radius: 6px; margin-left: 6px; cursor: pointer; font-family: inherit; font-size: 0.8rem; }
        .pagina { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 20px; }
        .marca { text-align: center; margin-bottom: 32px; }
        .marca-icone { width: 64px; height: 64px; background-color: var(--cor-primaria); border-radius: 20px; display: flex; align-items: center; justify-content: center; margin: 0 auto 14px; font-size: 1.8rem; color: white; }
        .marca h1 { font-family: 'DM Serif Display', serif; font-size: 1.8rem; color: var(--cor-primaria); margin-bottom: 4px; }
        .marca p { font-size: 0.9rem; color: var(--cor-muted); }
        .card-form { background: var(--cor-branco); border-radius: 20px; padding: 36px 32px; width: 100%; max-width: 400px; box-shadow: 0 4px 24px rgba(5,150,105,0.08); border: 1px solid var(--cor-suave); }
        .card-form h2 { font-family: 'DM Serif Display', serif; font-size: 1.4rem; margin-bottom: 4px; }
        .card-form .subtitulo { font-size: 0.875rem; color: var(--cor-muted); margin-bottom: 24px; }
        .campo { margin-bottom: 16px; }
        .campo label { display: block; font-size: 0.85rem; font-weight: 500; margin-bottom: 6px; }
        .campo-wrapper { position: relative; }
        .campo-wrapper i.ic { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--cor-muted); font-size: 0.9rem; }
        .campo input { width: 100%; padding: 12px 14px 12px 42px; border: 1.5px solid #e2e8f0; border-radius: 10px; font-family: inherit; font-size: 0.95rem; color: var(--cor-texto); background: var(--cor-fundo); outline: none; transition: border-color 0.2s, box-shadow 0.2s; }
        body.alto-contraste .campo input { background: #2a2a2a; border-color: #555; color: #fff; }
        .campo input:focus { border-color: var(--cor-primaria); box-shadow: 0 0 0 3px rgba(5,150,105,0.12); }
        .campo input::placeholder { color: #a0aec0; }
        .toggle-senha { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--cor-muted); cursor: pointer; font-size: 0.9rem; padding: 0; }
        .linha-senha { display: flex; justify-content: flex-end; margin-top: -8px; margin-bottom: 20px; }
        .linha-senha a { font-size: 0.8rem; color: var(--cor-primaria); text-decoration: none; }
        .linha-senha a:hover { text-decoration: underline; }
        .btn-primario { width: 100%; padding: 14px; background-color: var(--cor-primaria); color: white; border: none; border-radius: 12px; font-family: inherit; font-size: 1rem; font-weight: 500; cursor: pointer; transition: background-color 0.2s, transform 0.1s; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-primario:hover { background-color: var(--cor-primaria-escura); }
        .btn-primario:active { transform: scale(0.98); }
        .divisor { display: flex; align-items: center; gap: 12px; margin: 20px 0; }
        .divisor hr { flex: 1; border: none; border-top: 1px solid #e2e8f0; }
        .divisor span { font-size: 0.8rem; color: var(--cor-muted); }
        .btn-social { width: 100%; padding: 12px; background: var(--cor-branco); border: 1.5px solid #e2e8f0; border-radius: 12px; font-family: inherit; font-size: 0.9rem; color: var(--cor-texto); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: background 0.2s, border-color 0.2s; }
        .btn-social:hover { background: var(--cor-fundo); border-color: var(--cor-primaria); }
        .rodape-card { text-align: center; margin-top: 20px; font-size: 0.875rem; color: var(--cor-muted); }
        .rodape-card a { color: var(--cor-primaria); text-decoration: none; font-weight: 500; }
        .msg-erro { background: #fef2f2; border: 1px solid #fecaca; border-radius: 8px; padding: 10px 14px; font-size: 0.85rem; color: #dc2626; margin-bottom: 16px; display: none; align-items: center; gap: 8px; }
        .msg-erro.visivel { display: flex; }
        body.alto-contraste .msg-erro { background: #3d1515; border-color: #7f1d1d; color: #fca5a5; }
        .btn-primario .spinner { display: none; }
        .btn-primario.carregando .texto-btn { display: none; }
        .btn-primario.carregando .spinner { display: inline-flex; align-items: center; gap: 8px; }
        @keyframes girar { to { transform: rotate(360deg); } }
        .spinner i { animation: girar 0.8s linear infinite; }
        @media (max-width: 440px) { .card-form { padding: 28px 18px; } }
    </style>
</head>
<body>

    <script src="Auth.js"></script>
    <script>
        // Se já estiver logado, vai direto para o app
        const auth = new Auth();
        if (auth.estaLogado()) window.location.href = 'index.html';
    </script>

    <div class="barra-acessibilidade">
        <span><i class="fa-solid fa-heart-pulse"></i> Mente Acolhedora</span>
        <div class="controles-acess">
            <button id="btn-aumentar-fonte">A+</button>
            <button id="btn-diminuir-fonte">A-</button>
            <button id="btn-alto-contraste"><i class="fa-solid fa-circle-half-stroke"></i></button>
        </div>
    </div>

    <div class="pagina">
        <div class="marca">
            <div class="marca-icone"><i class="fa-solid fa-leaf"></i></div>
            <h1>Mente Acolhedora</h1>
            <p>Cuidado para quem cuida de si</p>
        </div>

        <div class="card-form">
            <h2>Bem-vindo de volta</h2>
            <p class="subtitulo">Entre na sua conta para continuar</p>

            <div class="msg-erro" id="msg-erro">
                <i class="fa-solid fa-circle-exclamation"></i>
                <span id="msg-erro-texto"></span>
            </div>

            <div class="campo">
                <label for="email">E-mail</label>
                <div class="campo-wrapper">
                    <i class="fa-regular fa-envelope ic"></i>
                    <input type="email" id="email" placeholder="seu@email.com" autocomplete="email">
                </div>
            </div>

            <div class="campo">
                <label for="senha">Senha</label>
                <div class="campo-wrapper">
                    <i class="fa-solid fa-lock ic"></i>
                    <input type="password" id="senha" placeholder="••••••••" autocomplete="current-password">
                    <button class="toggle-senha" id="toggle-senha" type="button" aria-label="Mostrar senha">
                        <i class="fa-regular fa-eye" id="icone-senha"></i>
                    </button>
                </div>
            </div>

            <div class="linha-senha"><a href="#">Esqueceu a senha?</a></div>

            <button class="btn-primario" id="btn-entrar" type="button">
                <span class="texto-btn"><i class="fa-solid fa-arrow-right-to-bracket"></i> Entrar</span>
                <span class="spinner"><i class="fa-solid fa-circle-notch"></i> Entrando...</span>
            </button>

            <div class="divisor"><hr><span>ou</span><hr></div>

            <button class="btn-social" type="button">
                <svg width="18" height="18" viewBox="0 0 48 48"><path d="M43.611 20.083H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z" fill="#FFC107"/><path d="M6.306 14.691l6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z" fill="#FF3D00"/><path d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238A11.91 11.91 0 0124 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z" fill="#4CAF50"/><path d="M43.611 20.083H24v8h11.303a12.04 12.04 0 01-4.087 5.571l6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z" fill="#1976D2"/></svg>
                Entrar com Google
            </button>

            <p class="rodape-card">Não tem conta? <a href="cadastro.html">Criar conta grátis</a></p>
        </div>
    </div>

    <script>
        // Acessibilidade
        let tam = 16;
        document.getElementById('btn-aumentar-fonte').onclick = () => { if(tam<24){tam+=2; document.documentElement.style.setProperty('--tamanho-base',tam+'px');} };
        document.getElementById('btn-diminuir-fonte').onclick = () => { if(tam>14){tam-=2; document.documentElement.style.setProperty('--tamanho-base',tam+'px');} };
        document.getElementById('btn-alto-contraste').onclick = () => document.body.classList.toggle('alto-contraste');

        // Toggle senha
        document.getElementById('toggle-senha').onclick = function() {
            const inp = document.getElementById('senha');
            const ic = document.getElementById('icone-senha');
            const mostrar = inp.type === 'password';
            inp.type = mostrar ? 'text' : 'password';
            ic.className = mostrar ? 'fa-regular fa-eye-slash' : 'fa-regular fa-eye';
        };

        // Login
        function tentarLogin() {
            const email = document.getElementById('email').value.trim();
            const senha = document.getElementById('senha').value;
            const erroEl = document.getElementById('msg-erro');
            const btn = document.getElementById('btn-entrar');

            erroEl.classList.remove('visivel');

            if (!email || !senha) {
                document.getElementById('msg-erro-texto').textContent = 'Preencha e-mail e senha.';
                erroEl.classList.add('visivel'); return;
            }

            btn.classList.add('carregando');

            // Pequeno delay para dar feedback visual
            setTimeout(() => {
                const resultado = auth.login(email, senha);
                btn.classList.remove('carregando');
                if (resultado.sucesso) {
                    window.location.href = 'index.html';
                } else {
                    document.getElementById('msg-erro-texto').textContent = resultado.mensagem;
                    erroEl.classList.add('visivel');
                }
            }, 600);
        }

        document.getElementById('btn-entrar').onclick = tentarLogin;
        ['email','senha'].forEach(id => {
            document.getElementById(id).addEventListener('keydown', e => { if(e.key==='Enter') tentarLogin(); });
        });
    </script>
</body>
</html>
